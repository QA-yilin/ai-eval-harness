tasks:
  rag-layered:
    description: RAG 三层链路 + 分层诊断
    pipeline: rag_pipeline
    dataset: golden-set-19
    corpus: corpus-company
    evaluators: [retrieval, understanding, generation]
    output_prefix: rag-layered

  judge-calibration:
    description: Judge 校准
    dataset: judge-calibration-golden
    judge: deepseek
    evaluators: [kappa]
    output_prefix: judge-calibration

  agent-trajectory:
    description: Agent 轨迹测试
    dataset: agent-tasks
  #  model: qwen14b
    evaluators: [ agent_trajectory ]
    output_prefix: agent-trajectory

  prompt-injection:
    description: Prompt 注入测试
    dataset: injection-cases
  #  model: qwen14b
    evaluators: [ injection_defense ]
    output_prefix: prompt-injection

  agent-negative:
    description: Agent 负向轨迹评测（歧义/漏执行/错调用/中断/逻辑混乱）
    dataset: agent-negative
    evaluators: [ agent_negative ]
    output_prefix: agent-negative

  memory:
    description: 大模型记忆体验评测（留存/一致性/冲突/丢失/冗余/遗忘）
    dataset: memory-cases
    evaluators: [ memory ]
    output_prefix: memory

  harness:
    description: Harness 调度体验评测（路由/兜底/隔离/时效/适配）
    dataset: harness-cases
    evaluators: [ harness ]
    output_prefix: harness


